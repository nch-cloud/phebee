  #################
  # Step Functions
  #################

  InstallRDFXMLSFN:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/install_rdfxml.asl.json
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SAMLogs.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionSubstitutions:
        StartLoadFunctionArn: !Ref StartLoadFunction
        GetLoadStatusFunctionArn: !Ref GetLoadStatusFunction
        Region: !Sub ${AWS::Region}
        LoaderRole: !GetAtt NeptuneLoaderRole.Arn
      Type: STANDARD
      Policies:
        - !Ref PheBeeStepFunctionPolicy
        - Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt StartLoadFunction.Arn
              - !GetAtt GetLoadStatusFunction.Arn

  UpdateHPOSFN:
    Type: AWS::Serverless::StateMachine
    Properties:
      # Named explicitly so the role below can grant StartExecution on this
      # machine without a circular reference (see ImportPhenopacketsSFN).
      Name: !Sub UpdateHPOSFN-${AppName}
      DefinitionUri: statemachine/update_hpo.asl.json
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SAMLogs.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionSubstitutions:
        InstallRDFXMLSFNArn: !Ref InstallRDFXMLSFN
        DownloadGithubReleaseFunctionArn: !Ref DownloadGithubReleaseFunction
        UpdateInstallTimestampFunctionArn: !Ref UpdateInstallTimestampFunction
        MaterializeOntologyHierarchyFunction: !GetAtt MaterializeOntologyHierarchyFunction.Arn
        InsertOntologyHierarchyBatchFunction: !GetAtt InsertOntologyHierarchyBatchFunction.Arn
        CleanupS3PrefixFunction: !GetAtt CleanupS3PrefixFunction.Arn
        DeleteOntologyHierarchyPartitionFunction: !GetAtt DeleteOntologyHierarchyPartitionFunction.Arn
        AthenaDatabase: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
        AthenaOntologyHierarchyTable: !Ref IcebergOntologyHierarchyTable
        PheBeeBucketName: !Ref PheBeeBucket
        PheBeeBus: !Ref PheBeeBus
      Type: STANDARD
      Policies:
        - !Ref PheBeeStepFunctionPolicy
        - Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt DownloadGithubReleaseFunction.Arn
              - !GetAtt UpdateInstallTimestampFunction.Arn
              - !GetAtt MaterializeOntologyHierarchyFunction.Arn
              - !GetAtt InsertOntologyHierarchyBatchFunction.Arn
              - !GetAtt CleanupS3PrefixFunction.Arn
              - !GetAtt DeleteOntologyHierarchyPartitionFunction.Arn
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              - !GetAtt InstallRDFXMLSFN.Arn
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !GetAtt PheBeeBucket.Arn
              - !Sub "${PheBeeBucket.Arn}/*"
          # The nested InstallRDFXMLSFN run (startExecution.sync) is tracked through
          # the EventBridge managed rule in PheBeeStepFunctionPolicy; Describe and
          # Stop are needed only for that child's executions.
          - Effect: Allow
            Action:
              - states:DescribeExecution
              - states:StopExecution
            Resource:
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${InstallRDFXMLSFN.Name}:*"
          # The hierarchy insert step is a Distributed Map, which runs its
          # iterations as child executions of this state machine, and must be
          # able to describe and stop them when it aborts or is redriven.
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:UpdateHPOSFN-${AppName}
          - Effect: Allow
            Action:
              - states:DescribeExecution
              - states:StopExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:UpdateHPOSFN-${AppName}:*
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:UpdateHPOSFN-${AppName}/*

  UpdateMondoSFN:
    Type: AWS::Serverless::StateMachine
    Properties:
      # Named explicitly so the role below can grant StartExecution on this
      # machine without a circular reference (see ImportPhenopacketsSFN).
      Name: !Sub UpdateMondoSFN-${AppName}
      DefinitionUri: statemachine/update_mondo.asl.json
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SAMLogs.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionSubstitutions:
        InstallRDFXMLSFNArn: !Ref InstallRDFXMLSFN
        DownloadGithubReleaseFunctionArn: !Ref DownloadGithubReleaseFunction
        UpdateInstallTimestampFunctionArn: !Ref UpdateInstallTimestampFunction
        MaterializeOntologyHierarchyFunction: !GetAtt MaterializeOntologyHierarchyFunction.Arn
        InsertOntologyHierarchyBatchFunction: !GetAtt InsertOntologyHierarchyBatchFunction.Arn
        CleanupS3PrefixFunction: !GetAtt CleanupS3PrefixFunction.Arn
        DeleteOntologyHierarchyPartitionFunction: !GetAtt DeleteOntologyHierarchyPartitionFunction.Arn
        AthenaDatabase: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
        AthenaOntologyHierarchyTable: !Ref IcebergOntologyHierarchyTable
        PheBeeBucketName: !Ref PheBeeBucket
        PheBeeBus: !Ref PheBeeBus
      Type: STANDARD
      Policies:
        - !Ref PheBeeStepFunctionPolicy
        - Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt DownloadGithubReleaseFunction.Arn
              - !GetAtt UpdateInstallTimestampFunction.Arn
              - !GetAtt MaterializeOntologyHierarchyFunction.Arn
              - !GetAtt InsertOntologyHierarchyBatchFunction.Arn
              - !GetAtt CleanupS3PrefixFunction.Arn
              - !GetAtt DeleteOntologyHierarchyPartitionFunction.Arn
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              - !GetAtt InstallRDFXMLSFN.Arn
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !GetAtt PheBeeBucket.Arn
              - !Sub "${PheBeeBucket.Arn}/*"
          # The nested InstallRDFXMLSFN run (startExecution.sync) is tracked through
          # the EventBridge managed rule in PheBeeStepFunctionPolicy; Describe and
          # Stop are needed only for that child's executions.
          - Effect: Allow
            Action:
              - states:DescribeExecution
              - states:StopExecution
            Resource:
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${InstallRDFXMLSFN.Name}:*"
          # The hierarchy insert step is a Distributed Map, which runs its
          # iterations as child executions of this state machine, and must be
          # able to describe and stop them when it aborts or is redriven.
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:UpdateMondoSFN-${AppName}
          - Effect: Allow
            Action:
              - states:DescribeExecution
              - states:StopExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:UpdateMondoSFN-${AppName}:*
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:UpdateMondoSFN-${AppName}/*

  UpdateECOSFN:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/update_eco.asl.json
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SAMLogs.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionSubstitutions:
        InstallRDFXMLSFNArn: !Ref InstallRDFXMLSFN
        DownloadGithubReleaseFunctionArn: !Ref DownloadGithubReleaseFunction
        UpdateInstallTimestampFunctionArn: !Ref UpdateInstallTimestampFunction
        PheBeeBus: !Ref PheBeeBus
      Type: STANDARD
      Policies:
        - !Ref PheBeeStepFunctionPolicy
        - Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt DownloadGithubReleaseFunction.Arn
              - !GetAtt UpdateInstallTimestampFunction.Arn
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              - !GetAtt InstallRDFXMLSFN.Arn
          # The nested InstallRDFXMLSFN run (startExecution.sync) is tracked through
          # the EventBridge managed rule in PheBeeStepFunctionPolicy; Describe and
          # Stop are needed only for that child's executions.
          - Effect: Allow
            Action:
              - states:DescribeExecution
              - states:StopExecution
            Resource:
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${InstallRDFXMLSFN.Name}:*"


  ImportPhenopacketsSFN:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ImportPhenopacketsSFN-${AppName}
      DefinitionUri: statemachine/import_phenopackets.asl.json
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt SAMLogs.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionSubstitutions:
        ParsePhenopacketCollectionFunctionArn: !Ref ParsePhenopacketCollectionFunction
        ProcessPhenopacketFunctionArn: !Ref ProcessPhenopacketFunction
        CreateSubjectFunctionArn: !Ref CreateSubjectFunction
        PrepareEvidencePayloadFunctionArn: !Ref PrepareEvidencePayloadFunction
        CreateEvidenceFunctionArn: !Ref CreateEvidenceFunction
        MaterializeProjectSubjectTermsFunction: !GetAtt MaterializeProjectSubjectTermsFunction.Arn
      Type: STANDARD
      Policies:
        - !Ref PheBeeStepFunctionPolicy
        - !Ref PheBeeS3ReadPolicy
        - !Ref PheBeeS3WritePolicy
        - Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt CreateSubjectFunction.Arn
              - !GetAtt ParsePhenopacketCollectionFunction.Arn
              - !GetAtt ProcessPhenopacketFunction.Arn
              - !GetAtt PrepareEvidencePayloadFunction.Arn
              - !GetAtt CreateEvidenceFunction.Arn
              - !GetAtt MaterializeProjectSubjectTermsFunction.Arn
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ImportPhenopacketsSFN-${AppName}


  #################
  # DynamoDB
  #################

  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  #################
  # Iceberg Tables
  #################

  IcebergGlueDatabase:
    Type: AWS::Glue::Database
    Condition: ShouldCreateIcebergDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]

  CreateEvidenceTableResource:
    Type: Custom::IcebergTable
    Condition: ShouldCreateEvidenceTable
    Properties:
      ServiceToken: !GetAtt CreateEvidenceTableFunction.Arn
      Database: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
      Table: !Ref IcebergEvidenceTable
      S3Location: !Sub "s3://${PheBeeBucket}/iceberg/evidence/"
      QueryResultsS3: !Sub "s3://${PheBeeBucket}/athena-results/${AppName}/"
      Version: "4.0"

  CreateSubjectTermsBySubjectTableResource:
    Type: Custom::IcebergTable
    Condition: ShouldCreateSubjectTermsBySubjectTable
    Properties:
      ServiceToken: !GetAtt CreateSubjectTermsBySubjectTableFunction.Arn
      Database: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
      Table: !Ref IcebergSubjectTermsBySubjectTable
      S3Location: !Sub "s3://${PheBeeBucket}/iceberg/subject_terms_by_subject/"
      QueryResultsS3: !Sub "s3://${PheBeeBucket}/athena-results/${AppName}/"
      Version: "1.0"

  CreateSubjectTermsByProjectTermTableResource:
    Type: Custom::IcebergTable
    Condition: ShouldCreateSubjectTermsByProjectTermTable
    Properties:
      ServiceToken: !GetAtt CreateSubjectTermsByProjectTermTableFunction.Arn
      Database: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
      Table: !Ref IcebergSubjectTermsByProjectTermTable
      S3Location: !Sub "s3://${PheBeeBucket}/iceberg/subject_terms_by_project_term/"
      QueryResultsS3: !Sub "s3://${PheBeeBucket}/athena-results/${AppName}/"
      Version: "1.0"

  CreateOntologyHierarchyTableResource:
    Type: Custom::IcebergTable
    Condition: ShouldCreateOntologyHierarchyTable
    Properties:
      ServiceToken: !GetAtt CreateOntologyHierarchyTableFunction.Arn
      Database: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
      Table: !Ref IcebergOntologyHierarchyTable
      S3Location: !Sub "s3://${PheBeeBucket}/iceberg/ontology_hierarchy/"
      QueryResultsS3: !Sub "s3://${PheBeeBucket}/athena-results/${AppName}/"
      Version: "1.0"

  #################
  # S3 Storage
  #################

  PheBeeBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateS3Bucket
    Properties:
      LoggingConfiguration: 
        !If 
          - ShouldEnableS3Logging
          - DestinationBucketName: !Ref S3AccessLogBucketName
            LogFilePrefix: !Ref S3AccessLogPrefix
          - !Ref AWS::NoValue
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm:  AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ObjectLockEnabled: false

  PheBeeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateS3Bucket
    Properties:
      Bucket: !Ref PheBeeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSSLRequestsOnly # AWS Foundational Security Best Practices v1.0.0 S3.5
            Action: "s3:*"
            Principal: "*"
            Effect: "Deny"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${PheBeeBucket}"
              - !Sub "arn:${AWS::Partition}:s3:::${PheBeeBucket}/*"

  #################
  # HTTP API
  #################

  # REST API rather than HTTP API: only REST APIs support a PRIVATE endpoint.
  # Routes, bodies and SigV4 auth are unchanged from the HTTP API; the URL gains
  # the stage as its first path segment.
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub phebee-${AppName}
      StageName: !Ref ApiStageName
      OpenApiVersion: "3.0.1"
      # Binary media types are declared in api.yaml
      # (x-amazon-apigateway-binary-media-types); SAM cannot inject them into
      # an included definition.
      # The definition is an included file, so SAM's change hash cannot see
      # edits to api.yaml; without this, a changed route would never reach the stage.
      AlwaysDeploy: true
      EndpointConfiguration:
        Type: !Ref ApiEndpointType
        VPCEndpointIds: !If
          - ShouldAssociateApiVpcEndpoint
          - - !Ref ExecuteApiVpcEndpointId
          - !Ref AWS::NoValue
      # The resource policy lives in api.yaml (x-amazon-apigateway-policy);
      # SAM cannot inject Auth settings into an included definition.
      DefinitionBody:
        'Fn::Transform':
          Name: 'AWS::Include'
          Parameters:
            Location: 'api.yaml'

  #################
  # EventBridge
  #################

  PheBeeBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub phebee-bus-${AppName}

  ####################
  # Scheduled Updates
  ####################

  UpdateHPOScheduleRule:
    Type: AWS::Events::Rule
    Condition: EnableScheduledOntologyUpdate
    Properties:
      Name: !Sub UpdateHPO-OnSchedule-${AppName}
      ScheduleExpression: !Ref HPOScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt UpdateHPOSFN.Arn
          Id: "UpdateHPO"
          RoleArn: !GetAtt UpdateOntologyInvokeRole.Arn
          Input: '{"test": false}'
  
  UpdateMondoScheduleRule:
    Type: AWS::Events::Rule
    Condition: EnableScheduledOntologyUpdate
    Properties:
      Name: !Sub UpdateMondo-OnSchedule-${AppName}
      ScheduleExpression: !Ref MondoScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt UpdateMondoSFN.Arn
          Id: "UpdateMondo"
          RoleArn: !GetAtt UpdateOntologyInvokeRole.Arn
          Input: '{"test": false}'

  UpdateECOScheduleRule:
    Type: AWS::Events::Rule
    Condition: EnableScheduledOntologyUpdate
    Properties:
      Name: !Sub UpdateECO-OnSchedule-${AppName}
      ScheduleExpression: !Ref ECOScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt UpdateECOSFN.Arn
          Id: "UpdateECO"
          RoleArn: !GetAtt UpdateOntologyInvokeRole.Arn
          Input: '{"test": false}'

  # ============================================================================
  # Rebuild Materialized Data Pipeline Resources
  # ============================================================================

  # Lambda Functions for Rebuild Pipeline

  # Shared IAM Roles for Rebuild Pipeline

  RebuildAthenaQueriesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-RebuildAthenaQueriesRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: AthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource: "*"
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt PheBeeBucket.Arn
                  - !Sub "${PheBeeBucket.Arn}/*"
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:UpdateTable
                Resource: "*"
        - PolicyName: LakeFormationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                  - lakeformation:GetWorkUnits
                  - lakeformation:StartQueryPlanning
                  - lakeformation:GetWorkUnitResults
                  - lakeformation:GetQueryState
                  - lakeformation:GetQueryStatistics
                Resource: "*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt DynamoDBTable.Arn

  RebuildNeptuneQueriesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-RebuildNeptuneQueriesRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: AthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource: "*"
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt PheBeeBucket.Arn
                  - !Sub "${PheBeeBucket.Arn}/*"
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                Resource: "*"
        - PolicyName: LakeFormationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                  - lakeformation:GetWorkUnits
                  - lakeformation:StartQueryPlanning
                  - lakeformation:GetWorkUnitResults
                  - lakeformation:GetQueryState
                  - lakeformation:GetQueryStatistics
                Resource: "*"
        - PolicyName: NeptuneAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - neptune-db:ReadDataViaQuery
                  - neptune-db:GetQueryStatus
                Resource: !Sub "arn:aws:neptune-db:${AWS::Region}:${AWS::AccountId}:${PheBeeNeptuneCluster.ClusterResourceId}/*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt DynamoDBTable.Arn

  ValidateRebuildInputFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ValidateRebuildInput
      CodeUri: functions
      Handler: validate_rebuild_input.lambda_handler
      MemorySize: 256
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]

  TruncateIcebergTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-TruncateIcebergTable
      CodeUri: functions
      Handler: truncate_iceberg_table.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildAthenaQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  ClearNeptuneGraphFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ClearNeptuneGraph
      CodeUri: functions
      Handler: clear_neptune_graph.lambda_handler
      MemorySize: 512
      Timeout: 900
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          Region: !Ref AWS::Region
          NeptuneClusterIdentifier: !Ref PheBeeNeptuneCluster
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Policies:
        - !Ref PheBeeNeptuneReadPolicy
        - !Ref PheBeeNeptuneDeletePolicy

  NotifyRebuildCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-NotifyRebuildComplete
      CodeUri: functions
      Handler: notify_rebuild_complete.lambda_handler
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          EventBusName: !Ref PheBeeBus
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Policies:
        - Statement:
          - Effect: Allow
            Action: events:PutEvents
            Resource: !GetAtt PheBeeBus.Arn

  NotifyRebuildFailureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-NotifyRebuildFailure
      CodeUri: functions
      Handler: notify_rebuild_failure.lambda_handler
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          EventBusName: !Ref PheBeeBus
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Policies:
        - Statement:
          - Effect: Allow
            Action: events:PutEvents
            Resource: !GetAtt PheBeeBus.Arn

  GatherEvidenceBaselineStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-GatherEvidenceBaselineStats
      CodeUri: functions
      Handler: gather_evidence_baseline_stats.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildAthenaQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  ValidateRehashFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ValidateRehash
      CodeUri: functions
      Handler: validate_rehash.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildAthenaQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  GatherIcebergBaselineStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-GatherIcebergBaselineStats
      CodeUri: functions
      Handler: gather_iceberg_baseline_stats.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildAthenaQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          PheBeeDynamoTable: !Ref DynamoDBTable
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  ValidateMaterializationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ValidateMaterialization
      CodeUri: functions
      Handler: validate_materialization.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildAthenaQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  GatherNeptuneBaselineStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-GatherNeptuneBaselineStats
      CodeUri: functions
      Handler: gather_neptune_baseline_stats.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildNeptuneQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          Region: !Ref AWS::Region
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  ValidateNeptuneFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ValidateNeptune
      CodeUri: functions
      Handler: validate_neptune.lambda_handler
      MemorySize: 512
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildNeptuneQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          Region: !Ref AWS::Region
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  ResetNeptuneDatabaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ResetNeptuneDatabase
      CodeUri: functions
      Handler: reset_neptune_database_wrapper.lambda_handler
      MemorySize: 512
      Timeout: 600
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          NeptuneClusterIdentifier: !Ref PheBeeNeptuneCluster
          Region: !Ref AWS::Region
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Policies:
        - !Ref PheBeeNeptuneResetPolicy

  ValidateNeptuneCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ValidateNeptuneComplete
      CodeUri: functions
      Handler: validate_neptune_complete.lambda_handler
      MemorySize: 1024
      Timeout: 900
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt RebuildNeptuneQueriesRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          Region: !Ref AWS::Region
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket
          PheBeeDynamoTable: !Ref DynamoDBTable
          ICEBERG_DATABASE: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
          ICEBERG_ONTOLOGY_HIERARCHY_TABLE: !Ref IcebergOntologyHierarchyTable

  ExecuteSparqlReadonlyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-ExecuteSparqlReadonly
      CodeUri: functions
      Handler: execute_sparql_readonly.lambda_handler
      MemorySize: 256
      Timeout: 900
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          Region: !Ref AWS::Region
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Policies:
        - !Ref PheBeeNeptuneReadPolicy

  # State Machine and IAM Role

  ClearNeptuneGraphStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AppName}-ClearNeptuneGraphStateMachine
      Role: !GetAtt ClearNeptuneGraphStateMachineRole.Arn
      DefinitionUri: statemachine/clear_neptune_graph.asl.json
      DefinitionSubstitutions:
        ClearNeptuneGraphFunction: !GetAtt ClearNeptuneGraphFunction.Arn
        GraphUri: "http://ods.nationwidechildrens.org/phebee/subjects"

  ClearNeptuneGraphStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-ClearNeptuneGraphStateMachineRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ClearNeptuneGraphFunction.Arn

  RebuildMaterializedDataStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AppName}-RebuildMaterializedDataStateMachine
      Role: !GetAtt RebuildStateMachineRole.Arn
      DefinitionUri: statemachine/rebuild_materialized_data.asl.json
      DefinitionSubstitutions:
        ValidateRebuildInputFunction: !GetAtt ValidateRebuildInputFunction.Arn
        GatherEvidenceBaselineStatsFunction: !GetAtt GatherEvidenceBaselineStatsFunction.Arn
        ValidateRehashFunction: !GetAtt ValidateRehashFunction.Arn
        GatherIcebergBaselineStatsFunction: !GetAtt GatherIcebergBaselineStatsFunction.Arn
        ValidateMaterializationFunction: !GetAtt ValidateMaterializationFunction.Arn
        GatherNeptuneBaselineStatsFunction: !GetAtt GatherNeptuneBaselineStatsFunction.Arn
        ValidateNeptuneFunction: !GetAtt ValidateNeptuneFunction.Arn
        ResetNeptuneDatabaseFunction: !GetAtt ResetNeptuneDatabaseFunction.Arn
        ValidateNeptuneCompleteFunction: !GetAtt ValidateNeptuneCompleteFunction.Arn
        TruncateIcebergTableFunction: !GetAtt TruncateIcebergTableFunction.Arn
        ClearNeptuneGraphFunction: !GetAtt ClearNeptuneGraphFunction.Arn
        NotifyRebuildCompleteFunction: !GetAtt NotifyRebuildCompleteFunction.Arn
        NotifyRebuildFailureFunction: !GetAtt NotifyRebuildFailureFunction.Arn
        UpdateHPOSFN: !Ref UpdateHPOSFN
        UpdateMondoSFN: !Ref UpdateMondoSFN
        UpdateECOSFN: !Ref UpdateECOSFN
        EMRServerlessApplicationId: !Ref EMRServerlessApplication
        EMRExecutionRoleArn: !GetAtt EMRExecutionRole.Arn
        PheBeeBucketName: !Ref PheBeeBucket
        DynamoDBTableName: !Ref DynamoDBTable
        AWSRegion: !Ref AWS::Region
        IcebergDatabase: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
        IcebergEvidenceTable: !Ref IcebergEvidenceTable
        IcebergSubjectTermsBySubjectTable: !Ref IcebergSubjectTermsBySubjectTable
        IcebergSubjectTermsByProjectTermTable: !Ref IcebergSubjectTermsByProjectTermTable
        StartNeptuneBulkLoadFunction: !GetAtt StartNeptuneBulkLoadFunction.Arn
        CheckNeptuneBulkLoadStatusFunction: !GetAtt CheckNeptuneBulkLoadStatusFunction.Arn
        EvaluateAllLoadStatusesFunction: !GetAtt EvaluateAllLoadStatusesFunction.Arn
        ClearNeptuneGraphStateMachine: !Ref ClearNeptuneGraphStateMachine

  RebuildStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-RebuildStateMachineRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ValidateRebuildInputFunction.Arn
                  - !GetAtt GatherEvidenceBaselineStatsFunction.Arn
                  - !GetAtt ValidateRehashFunction.Arn
                  - !GetAtt GatherIcebergBaselineStatsFunction.Arn
                  - !GetAtt ValidateMaterializationFunction.Arn
                  - !GetAtt GatherNeptuneBaselineStatsFunction.Arn
                  - !GetAtt ValidateNeptuneFunction.Arn
                  - !GetAtt ResetNeptuneDatabaseFunction.Arn
                  - !GetAtt ValidateNeptuneCompleteFunction.Arn
                  - !GetAtt TruncateIcebergTableFunction.Arn
                  - !GetAtt ClearNeptuneGraphFunction.Arn
                  - !GetAtt NotifyRebuildCompleteFunction.Arn
                  - !GetAtt NotifyRebuildFailureFunction.Arn
                  - !GetAtt StartNeptuneBulkLoadFunction.Arn
                  - !GetAtt CheckNeptuneBulkLoadStatusFunction.Arn
                  - !GetAtt EvaluateAllLoadStatusesFunction.Arn
        - PolicyName: EMRServerlessAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - emr-serverless:StartJobRun
                  - emr-serverless:GetJobRun
                  - emr-serverless:CancelJobRun
                Resource:
                  - !Sub "arn:aws:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/${EMRServerlessApplication}"
                  - !Sub "arn:aws:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/${EMRServerlessApplication}/jobruns/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EMRExecutionRole.Arn
        - PolicyName: EventBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:ListTargetsByRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource:
                  - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${AppName}-*"
                  - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForEMRServerlessJobRule"
        - PolicyName: ChildStateMachineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:StopExecution
                Resource:
                  - !Ref ClearNeptuneGraphStateMachine
                  - !Ref UpdateHPOSFN
                  - !Ref UpdateMondoSFN
                  - !Ref UpdateECOSFN
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource:
                  - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule"

Outputs:
  UpdateHPOSFNArn:
    Value: !Ref UpdateHPOSFN

  UpdateMondoSFNArn:
    Value: !Ref UpdateMondoSFN

  UpdateECOSFNArn:
    Value: !Ref UpdateECOSFN

  ImportPhenopacketsSFNArn:
    Value: !Ref ImportPhenopacketsSFN
    Description: ARN of the ImportPhenopackets state machine

  CreateProjectFunctionArn:
    Value: !Ref CreateProjectFunction

  ResetDatabaseFunctionArn:
    Value: !Ref ResetDatabaseFunction

  CheckBulkLoadStatusFunctionArn:
    Value: !GetAtt CheckBulkLoadStatusFunction.Arn
    Export:
      Name: !Sub "${AppName}-CheckBulkLoadStatusFunctionArn"

  BulkImportStateMachineArn:
    Value: !Ref BulkImportStateMachine
    Export:
      Name: !Sub "${AppName}-BulkImportStateMachineArn"

  RebuildMaterializedDataStateMachineArn:
    Value: !Ref RebuildMaterializedDataStateMachine
    Export:
      Name: !Sub "${AppName}-RebuildMaterializedDataStateMachineArn"

  EMRServerlessApplicationId:
    Value: !Ref EMRServerlessApplication
    Export:
      Name: !Sub "${AppName}-EMRServerlessApplicationId"

  EMRExecutionRoleArn:
    Value: !GetAtt EMRExecutionRole.Arn
    Export:
      Name: !Sub "${AppName}-EMRExecutionRoleArn"

  ValidateBulkImportFunctionArn:
    Value: !GetAtt ValidateBulkImportFunction.Arn
    Export:
      Name: !Sub "${AppName}-ValidateBulkImportFunctionArn"

  StartNeptuneBulkLoadFunctionArn:
    Value: !GetAtt StartNeptuneBulkLoadFunction.Arn
    Export:
      Name: !Sub "${AppName}-StartNeptuneBulkLoadFunctionArn"

  PheBeeBucketName:
    Value: !Ref PheBeeBucket
    Export:
      Name: !Sub "${AppName}-PheBeeBucketName"

  PheBeeBucketArn:
    Value: !GetAtt PheBeeBucket.Arn
    Export:
      Name: !Sub "${AppName}-PheBeeBucketArn"

  CheckNeptuneBulkLoadStatusFunctionArn:
    Value: !GetAtt CheckNeptuneBulkLoadStatusFunction.Arn
    Export:
      Name: !Sub "${AppName}-CheckNeptuneBulkLoadStatusFunctionArn"

  GetLoadStatusFunctionArn:
    Value: !GetAtt GetLoadStatusFunction.Arn
    Export:
      Name: !Sub "${AppName}-GetLoadStatusFunctionArn"

  QueryEvidenceByRunFunctionArn:
    Value: !GetAtt QueryEvidenceByRunFunction.Arn
    Export:
      Name: !Sub "${AppName}-QueryEvidenceByRunFunctionArn"

  QueryEvidenceFunctionArn:
    Value: !GetAtt QueryEvidenceFunction.Arn
    Export:
      Name: !Sub "${AppName}-QueryEvidenceFunctionArn"

  DynamoDBTableName:
    Description: Table name of the PheBee DynamoDB table
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub ${AppName}-DynamoDBTableName

  Region:
    Value: !Sub ${AWS::Region}

  NeptuneEndpoint:
    Value: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}

  NeptuneClusterIdentifier:
    Value: !Ref PheBeeNeptuneCluster
  
  ApiGatewayUrl:
    Description: Base URL of the PheBee API. For a PRIVATE API this resolves only inside the VPC when the execute-api endpoint has private DNS; otherwise use ApiGatewayVpceUrl, a custom domain, or the endpoint's DNS name with this hostname in the Host header.
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"

  ApiId:
    Description: REST API ID
    Value: !Ref RestApi

  ApiEndpointType:
    Description: REGIONAL (public hostname, IAM auth) or PRIVATE (VPC endpoint only)
    Value: !Ref ApiEndpointType

  ApiGatewayVpceUrl:
    Condition: ShouldAssociateApiVpcEndpoint
    Description: Endpoint-specific URL for the PRIVATE API, usable without private DNS (only when the endpoint is associated with the API)
    Value: !Sub
      - "https://${RestApi}-${Vpce}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"
      - Vpce: !Ref ExecuteApiVpcEndpointId

  AppName:
    Description: Application name used for resource naming
    Value: !Ref AppName

  PheBeeBus:
    Description: Name of the custom EventBridge bus for PheBee events
    Value: !Ref PheBeeBus
    Export:
      Name: !Sub "${AppName}-PheBeeBus"

  AthenaDatabase:
    Description: Glue database name for Athena queries
    Value: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
    Export:
      Name: !Sub "${AppName}-AthenaDatabase"
  
  AthenaEvidenceTable:
    Description: Evidence table name for Athena queries
    Value: !Ref IcebergEvidenceTable
    Export:
      Name: !Sub "${AppName}-AthenaEvidenceTable"

  AthenaSubjectTermsBySubjectTable:
    Description: Subject-terms table partitioned by subject_id for individual lookups
    Value: !Ref IcebergSubjectTermsBySubjectTable
    Export:
      Name: !Sub "${AppName}-AthenaSubjectTermsBySubjectTable"

  AthenaSubjectTermsByProjectTermTable:
    Description: Subject-terms table partitioned by (project_id, term_id) for term-filtered queries
    Value: !Ref IcebergSubjectTermsByProjectTermTable
    Export:
      Name: !Sub "${AppName}-AthenaSubjectTermsByProjectTermTable"

  AthenaOntologyHierarchyTable:
    Description: Ontology hierarchy table name for Athena queries
    Value: !Ref IcebergOntologyHierarchyTable
    Export:
      Name: !Sub "${AppName}-AthenaOntologyHierarchyTable"

  AthenaResultsLocation:
    Description: S3 location for Athena query results
    Value: !Sub "s3://${PheBeeBucket}/athena-results/${AppName}/"
    Export:
      Name: !Sub "${AppName}-AthenaResultsLocation"
      
  AthenaWorkgroup:

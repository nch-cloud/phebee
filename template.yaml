AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: PheBee
Globals:
  Function:
    Timeout: 90
    Architectures:
      - arm64
    Tracing: Active
    Runtime: python3.11
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: phebee

Parameters:
  AppName:
    Type: String
    Description: "Application name used for resource naming (e.g., phebee-dev-2)"
    Default: phebee
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Must contain only lowercase letters, numbers, and hyphens"

  # No defaults: these are required, and a typed parameter makes a missing or
  # malformed value fail at validation instead of partway through a deploy.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC that hosts all PheBee compute: Lambda functions, EMR Serverless and Neptune. ex: vpc-xxxxxxxxxxxxxx"

  SubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: "First private subnet for Lambda, EMR Serverless and Neptune. ex: subnet-xxxxxxxxxxxxxx"

  SubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: "Second private subnet, in a different availability zone. ex: subnet-xxxxxxxxxxxxxx"

  SubnetId3:
    Type: String
    Default: ""
    AllowedPattern: "^(subnet-[0-9a-f]{8,17})?$"
    ConstraintDescription: "Must be a subnet ID (subnet-...) or empty"
    Description: >-
      Optional third private subnet in a third availability zone. Spreads the
      Lambda, EMR Serverless and Neptune network interfaces over more address
      space and survives the loss of two zones. Leave empty in regions or
      accounts with only two zones.

  ServiceEgressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: "Must be an IPv4 CIDR block, e.g. 10.0.0.0/8"
    Description: >-
      Destination CIDR for HTTPS (tcp/443) egress from PheBee compute to AWS
      service endpoints. Leave at 0.0.0.0/0 when the subnets use S3 or
      DynamoDB gateway endpoints or NAT, since gateway endpoints route to
      Amazon's public prefix lists. Narrow it (e.g. 10.0.0.0/8) only when
      every AWS service is reached through interface endpoints in a
      private address range.

  ApiEndpointType:
    Type: String
    Default: REGIONAL
    AllowedValues: [REGIONAL, PRIVATE]
    Description: >-
      REGIONAL publishes the API on a public hostname, protected by IAM (SigV4)
      authentication. PRIVATE makes it reachable only through an execute-api
      VPC endpoint, so request and response bodies never leave the VPC.
      Switching between the two updates the API in place; its ID and URL do
      not change.

  ExecuteApiVpcEndpointId:
    Type: String
    Default: ""
    Description: >-
      Existing execute-api interface VPC endpoint (vpce-...) that callers use
      to reach a PRIVATE API. Required when ApiEndpointType is PRIVATE;
      ignored otherwise. The stack never creates VPC endpoints: see
      docs/networking.md.

  AssociateApiVpcEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Associate the execute-api VPC endpoint with the PRIVATE API, which gives
      it the extra hostname https://<api-id>-<vpce-id>.execute-api.<region>
      .amazonaws.com. API Gateway must be able to see the endpoint, so set
      false when ExecuteApiVpcEndpointId belongs to another account (a shared
      networking account, for example). Access is still restricted to that
      endpoint by the resource policy; clients then use the default hostname
      (if the endpoint has private DNS), a custom domain, or the endpoint's
      own DNS name with a Host header.

  ApiStageName:
    Type: String
    Default: v1
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
    Description: Stage name, which becomes the first path segment of the API URL.

  NeptuneLogRetentionDays:
    Type: Number
    Default: 365
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >-
      CloudWatch retention for the Neptune audit and slow-query log groups.
      Audit records contain full SPARQL text, including subject IRIs, so
      restrict read access to these groups as you would to the data.

  OntologyDownloadInVpc:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Place the GitHub ontology-download function inside the VPC as well. It
      fetches public ontology releases from api.github.com and handles no
      subject data, so it stays outside by default; set true only where every
      function must be in the VPC and the subnets have an egress path (NAT or
      proxy) to GitHub.

  CreateS3Bucket:
    Default: true
    AllowedValues:
      - true
      - false
    Description: Create a new S3 bucket to hold PheBee data
    Type: String

  S3AccessLogBucketName:
    Type: String
    Description: Optional. An existing bucket where access logs should be delivered.
    Default: ""
  
  S3AccessLogPrefix:
    Type: String
    Description: Optional. Prefix (folder path) for the logs in the log bucket.
    Default: phebee-access-logs/

  RunOntologyUpdatesOnSchedule:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether to enable scheduled ontology updates

  IcebergDatabase:
    Type: String
    Default: ""
    Description: "Glue database name for Iceberg tables. If empty, will use 'phebee_{AppName}'"

  CreateIcebergDatabaseFlag:
    Type: String
    Default: ""
    AllowedValues: ["true", "false", ""]
    Description: "Whether to create the Glue database. If empty, creates database only when IcebergDatabase is not provided (default behavior for backwards compatibility)"

  IcebergEvidenceTable:
    Type: String
    Default: "evidence"
    Description: "Iceberg table name for evidence storage"

  CreateEvidenceTableFlag:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Whether to create the Iceberg table for evidence storage"

  # Subject-Terms Analytical Table Parameters (two tables with different partitioning)
  IcebergSubjectTermsBySubjectTable:
    Type: String
    Default: "subject_terms_by_subject"
    Description: "Iceberg table name partitioned by subject_id for individual subject lookups"

  CreateSubjectTermsBySubjectTableFlag:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Whether to create the subject-terms-by-subject table"

  IcebergSubjectTermsByProjectTermTable:
    Type: String
    Default: "subject_terms_by_project_term"
    Description: "Iceberg table name partitioned by (project_id, term_id) for term-filtered queries"

  CreateSubjectTermsByProjectTermTableFlag:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Whether to create the subject-terms-by-project-term table"

  # Multi-Account Lake Formation Parameters
  CatalogAccountId:
    Type: String
    Default: ""
    Description: "Optional AWS account ID for cross-account Glue catalog access. If empty, uses current account."

  CatalogDatabaseName:
    Type: String
    Default: ""
    Description: "Optional database name in external catalog. If empty, uses IcebergDatabase value."

  # Ontology Hierarchy Table Parameters
  IcebergOntologyHierarchyTable:
    Type: String
    Default: "ontology_hierarchy"
    Description: "Iceberg table name for ontology hierarchies"

  CreateOntologyHierarchyTableFlag:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Whether to create the ontology hierarchy table"

  HPOScheduleExpression:
    Type: String
    Default: "cron(0 9 * * ? *)"  # 4 AM EST = 9 UTC
    Description: Cron expression for HPO update

  MondoScheduleExpression:
    Type: String
    Default: "cron(10 9 * * ? *)"  # 4:10 AM EST = 9:10 UTC
    Description: Cron expression for Mondo update

  ECOScheduleExpression:
    Type: String
    Default: "cron(20 9 * * ? *)"  # 4:20 AM EST = 9:20 UTC
    Description: Cron expression for ECO update

Rules:
  PrivateApiNeedsAnEndpoint:
    RuleCondition: !Equals [!Ref ApiEndpointType, PRIVATE]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExecuteApiVpcEndpointId, ""]]
        AssertDescription: A PRIVATE API needs an existing execute-api VPC endpoint; supply its ID in ExecuteApiVpcEndpointId.

Conditions:
  ShouldCreateS3Bucket: !Equals [!Ref CreateS3Bucket, true]

  OntologyDownloadInVpcEnabled: !Equals [!Ref OntologyDownloadInVpc, "true"]

  HasSubnetId3: !Not [!Equals [!Ref SubnetId3, ""]]

  PrivateApi: !Equals [!Ref ApiEndpointType, PRIVATE]

  ShouldAssociateApiVpcEndpoint: !And
    - !Condition PrivateApi
    - !Equals [!Ref AssociateApiVpcEndpoint, "true"]

  ShouldEnableS3Logging: !Not [!Equals [!Ref S3AccessLogBucketName, ""]]

  EnableScheduledOntologyUpdate: !Equals [!Ref RunOntologyUpdatesOnSchedule, "true"]

  IcebergDatabaseProvided: !Not [!Equals [!Ref IcebergDatabase, ""]]

  CreateIcebergDatabaseFlagIsTrue: !Equals [!Ref CreateIcebergDatabaseFlag, "true"]

  CreateIcebergDatabaseFlagIsEmpty: !Equals [!Ref CreateIcebergDatabaseFlag, ""]

  ShouldCreateEvidenceTable: !Equals [!Ref CreateEvidenceTableFlag, "true"]

  ShouldCreateSubjectTermsBySubjectTable: !Equals [!Ref CreateSubjectTermsBySubjectTableFlag, "true"]

  ShouldCreateSubjectTermsByProjectTermTable: !Equals [!Ref CreateSubjectTermsByProjectTermTableFlag, "true"]

  ShouldCreateOntologyHierarchyTable: !Equals [!Ref CreateOntologyHierarchyTableFlag, "true"]

  # Create database if: flag is explicitly true OR (flag is empty AND database name not provided)
  ShouldCreateIcebergDatabase: !Or
    - !Condition CreateIcebergDatabaseFlagIsTrue
    - !And
      - !Condition CreateIcebergDatabaseFlagIsEmpty
      - !Not [!Condition IcebergDatabaseProvided]

  CatalogAccountIdProvided: !Not [!Equals [!Ref CatalogAccountId, ""]]

  CatalogDatabaseNameProvided: !Not [!Equals [!Ref CatalogDatabaseName, ""]]

Resources:
  PheBeeUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AppName}-phebee-utils
      ContentUri: layers/phebee-utils/
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

  SAMLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/step_functions/phebee-${AppName}

  #################
  # IAM
  #################

  PheBeeStepFunctionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:CreateLogStream
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutLogEvents
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: "*"
          - Effect: Allow
            Action:
              - events:PutTargets
              - events:PutRule
              - events:DescribeRule
              - events:PutEvents
            Resource: !GetAtt PheBeeBus.Arn
          - Effect: Allow
            Action:
              - events:PutRule
              - events:PutTargets
              - events:DescribeRule
            Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule

  PheBeeAPIRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - !Ref PheBeeAPIPolicy

  PheBeeAPIPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt GetSourceInfoFunction.Arn
              - !GetAtt CreateProjectFunction.Arn
              - !GetAtt CreateSubjectFunction.Arn
              - !GetAtt GetSubjectFunction.Arn
              - !GetAtt GetSubjectTermInfoFunction.Arn
              - !GetAtt GetSubjectsPhenotypesFunction.Arn
              - !GetAtt RemoveSubjectFunction.Arn
              - !GetAtt RemoveProjectFunction.Arn
              - !GetAtt CreateEvidenceFunction.Arn
              - !GetAtt GetEvidenceFunction.Arn
              - !GetAtt QueryEvidenceFunction.Arn
              - !GetAtt RemoveEvidenceFunction.Arn
          - Effect: Allow
            Action:
              - states:StartSyncExecution
            Resource:
              - !GetAtt ImportPhenopacketsSFN.Arn

  PheBeeS3ReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !GetAtt PheBeeBucket.Arn
              - !Sub
                - ${Arn}/*
                - Arn: !GetAtt PheBeeBucket.Arn
  
  PheBeeS3WritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource:
              - !Sub
                - ${Arn}/*
                - Arn: !GetAtt PheBeeBucket.Arn
  
  PheBeeDynamoDBReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:Query
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:TransactGetItems
            Resource:
              - !GetAtt DynamoDBTable.Arn
  
  PheBeeDynamoDBWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              - dynamodb:TransactWriteItems
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt DynamoDBTable.Arn

  PheBeeNeptuneReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - neptune-db:ReadDataViaQuery
              - neptune-db:GetEngineStatus
            Resource: !Sub
              - arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${ClusterId}/*
              - ClusterId: !GetAtt PheBeeNeptuneCluster.ClusterResourceId
          - Effect: Allow
            Action:
              - rds:DescribeDBClusters
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AppName}-neptune-cluster
  
  PheBeeNeptuneLoadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - neptune-db:StartLoaderJob
              - neptune-db:GetLoaderJobStatus
            Resource: !Sub
              - arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${ClusterId}/*
              - ClusterId: !GetAtt PheBeeNeptuneCluster.ClusterResourceId

  PheBeeNeptuneWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - neptune-db:WriteDataViaQuery
            Resource: !Sub
              - arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${ClusterId}/*
              - ClusterId: !GetAtt PheBeeNeptuneCluster.ClusterResourceId

  PheBeeNeptuneDeletePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - neptune-db:DeleteDataViaQuery
            Resource: !Sub
              - arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${ClusterId}/*
              - ClusterId: !GetAtt PheBeeNeptuneCluster.ClusterResourceId




  PheBeeNeptuneResetPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - neptune-db:ResetDatabase
              - neptune-db:GetEngineStatus
              - neptune-db:ReadDataViaQuery
            Resource: !Sub
              - arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${ClusterId}/*
              - ClusterId: !GetAtt PheBeeNeptuneCluster.ClusterResourceId
          - Effect: Allow
            Action:
              - rds:DescribeDBClusters
            Resource: !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AppName}-neptune-cluster

  PheBeePutEventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${PheBeeBus}

  PheBeeIcebergPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - glue:CreateDatabase
              - glue:GetDatabase
              - glue:CreateTable
              - glue:GetTable
              - glue:UpdateTable
              - glue:DeleteTable
              - glue:GetPartitions
              - athena:StartQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:StopQueryExecution
              - athena:GetWorkGroup
              - lakeformation:GetDataAccess
              - lakeformation:GetWorkUnits
              - lakeformation:StartQueryPlanning
              - lakeformation:GetWorkUnitResults
              - lakeformation:GetQueryState
              - lakeformation:GetQueryStatistics
            Resource: "*"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "${PheBeeBucket.Arn}/iceberg/*"
              - !Sub "${PheBeeBucket.Arn}/athena-results/*"
              - !GetAtt PheBeeBucket.Arn

  CreateEvidenceTableRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateEvidenceTable
    Properties:
      RoleName: !Sub "${AppName}-CreateEvidenceTableRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref PheBeeIcebergPolicy

  CreateSubjectTermsBySubjectTableRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateSubjectTermsBySubjectTable
    Properties:
      RoleName: !Sub "${AppName}-CreateSubjectTermsBySubjectTableRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref PheBeeIcebergPolicy

  CreateSubjectTermsByProjectTermTableRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateSubjectTermsByProjectTermTable
    Properties:
      RoleName: !Sub "${AppName}-CreateSubjectTermsByProjectTermTableRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref PheBeeIcebergPolicy

  CreateOntologyHierarchyTableRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateOntologyHierarchyTable
    Properties:
      RoleName: !Sub "${AppName}-CreateOntologyHierarchyTableRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref PheBeeIcebergPolicy

  NeptuneLoaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub phebee-neptune-loader-role-${AppName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service: rds.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PheBeeS3ReadPolicy

  UpdateOntologyInvokeRole:
    Type: AWS::IAM::Role
    Condition: EnableScheduledOntologyUpdate
    Properties:
      RoleName: !Sub PheBeeInvokeOntologyUpdatersRole-${AppName}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "AllowEventBridgeToStartUpdaters"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "states:StartExecution"
                Resource:
                  - !GetAtt UpdateHPOSFN.Arn
                  - !GetAtt UpdateMondoSFN.Arn
                  - !GetAtt UpdateECOSFN.Arn

  #################
  # Neptune Cluster
  #################
  PheBeeNeptuneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Amazon Neptune Created
      GroupName: !Sub phebee-neptune-sg-${AppName}
      VpcId: !Ref VpcId
      # Ingress is a standalone resource (PheBeeNeptuneIngressFromClients) so this
      # group and PheBeeNeptuneClientSecurityGroup can reference each other.
      SecurityGroupEgress:
        # The cluster only initiates connections to S3, for bulk loads. Same
        # caveat as the Lambda group: an S3 gateway endpoint routes to public
        # prefix lists, so narrowing ServiceEgressCidr needs an interface endpoint.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref ServiceEgressCidr
          Description: Bulk-load reads from S3

  PheBeeNeptuneSubnetGroup:
    Type: AWS::Neptune::DBSubnetGroup
    Properties:
      SubnetIds:
      - !Ref SubnetId1
      - !Ref SubnetId2
      - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      DBSubnetGroupDescription: Subnet group for PheBee subnets
      DBSubnetGroupName: !Sub phebee-neptune-subnets-${AppName}

  PheBeeNeptuneParameterGroup:
    Type: AWS::Neptune::DBClusterParameterGroup
    Properties:
      Description: !Sub "Custom parameter group for ${AppName} Neptune cluster"
      Family: neptune1.4
      Parameters:
        neptune_query_timeout: 300000  # 5 minutes in milliseconds (default is 120000)
        # Without these two the audit and slowquery CloudWatch exports below ship
        # nothing. neptune_enable_audit_log is static: an existing cluster needs
        # an instance reboot after deploying this; a new cluster starts with it on.
        neptune_enable_audit_log: 1
        neptune_enable_slow_query_log: info
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-neptune-parameters

  # Defined here so they carry a retention period. Neptune creates them itself,
  # with no expiry, if they do not exist when the first log is delivered, hence
  # the DependsOn from the cluster. A deployment where Neptune already created
  # a group of this name must delete or import it before deploying this.
  PheBeeNeptuneAuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/neptune/${AppName}-neptune-cluster/audit
      RetentionInDays: !Ref NeptuneLogRetentionDays

  PheBeeNeptuneSlowQueryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/neptune/${AppName}-neptune-cluster/slowquery
      RetentionInDays: !Ref NeptuneLogRetentionDays

  PheBeeNeptuneCluster:
    Type: AWS::Neptune::DBCluster
    DependsOn:
      - PheBeeNeptuneAuditLogGroup
      - PheBeeNeptuneSlowQueryLogGroup
    Properties:
      DBClusterIdentifier: !Sub ${AppName}-neptune-cluster
      StorageEncrypted: true
      # Associating the role here is necessary to pass it as the role to use for our bulk loader
      AssociatedRoles:
        - RoleArn: !GetAtt NeptuneLoaderRole.Arn
      ServerlessScalingConfiguration:
        MinCapacity: 1
        MaxCapacity: 16
      PreferredMaintenanceWindow: mon:09:10-mon:09:40
      IamAuthEnabled: true
      DBSubnetGroupName: !Ref PheBeeNeptuneSubnetGroup
      PreferredBackupWindow: 03:59-04:29
      DBPort: 8182
      VpcSecurityGroupIds:
        - !Ref PheBeeNeptuneSecurityGroup
      CopyTagsToSnapshot: true
      DBClusterParameterGroupName: !Ref PheBeeNeptuneParameterGroup
      BackupRetentionPeriod: 7
      EnableCloudwatchLogsExports:
      - audit
      - slowquery

  PheBeeNeptuneInstance:
    Type: AWS::Neptune::DBInstance
    Properties:
      DBInstanceClass: db.r5.large
      DBClusterIdentifier: !Ref PheBeeNeptuneCluster
      DBSubnetGroupName: !Ref PheBeeNeptuneSubnetGroup
      DBParameterGroupName: default.neptune1.4
      AutoMinorVersionUpgrade: true

  #################
  # Lambdas
  #################

  PheBeeLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Amazon Neptune Created
      GroupName: !Sub phebee-lambda-sg-${AppName}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        # HTTPS to AWS service endpoints (DynamoDB, S3, Athena, Glue, EventBridge, ...).
        # Lambda log delivery, X-Ray and the Lambda API itself do not traverse
        # the function ENI, so nothing else is needed here. Neptune access is
        # granted separately by PheBeeNeptuneClientSecurityGroup.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref ServiceEgressCidr
          Description: HTTPS to AWS service endpoints

  # Attached, in addition to PheBeeLambdaSecurityGroup, only to functions that
  # call Neptune. Everything else in the VPC cannot reach port 8182.
  PheBeeNeptuneClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PheBee functions permitted to reach the Neptune cluster
      GroupName: !Sub phebee-neptune-client-sg-${AppName}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8182
          ToPort: 8182
          DestinationSecurityGroupId: !Ref PheBeeNeptuneSecurityGroup
          Description: SPARQL and bulk-load calls to the PheBee Neptune cluster

  PheBeeNeptuneIngressFromClients:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PheBeeNeptuneSecurityGroup
      SourceSecurityGroupId: !Ref PheBeeNeptuneClientSecurityGroup
      IpProtocol: tcp
      FromPort: 8182
      ToPort: 8182
      Description: PheBee Neptune clients

  # EMR Serverless workers run in a service-owned network and use ENIs in these
  # subnets only to reach customer-side resources, so no worker-to-worker rule
  # is needed. Jobs read and write S3, Glue and DynamoDB only.
  PheBeeEmrSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PheBee EMR Serverless workers
      GroupName: !Sub phebee-emr-sg-${AppName}
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref ServiceEgressCidr
          Description: HTTPS to AWS service endpoints

  DownloadGithubReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-DownloadGithubReleaseFunction
      CodeUri: functions
      Handler: download_github_release.lambda_handler
      MemorySize: 1024
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          PheBeeBucketName: !Ref PheBeeBucket
          PheBeeDynamoTable: !Ref DynamoDBTable
      # Fetches ontology releases from api.github.com and handles no subject data.
      # Outside the VPC by default so deployments without NAT still get ontology
      # updates; set OntologyDownloadInVpc=true where policy requires it and an
      # egress path exists.
      VpcConfig: !If
        - OntologyDownloadInVpcEnabled
        - SecurityGroupIds:
            - !Ref PheBeeLambdaSecurityGroup
          SubnetIds:
            - !Ref SubnetId1
            - !Ref SubnetId2
            - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
        - !Ref AWS::NoValue
      Policies:
        - !Ref PheBeeDynamoDBWritePolicy
        - !Ref PheBeeDynamoDBReadPolicy
        - !Ref PheBeeS3WritePolicy



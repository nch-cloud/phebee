  DeleteOntologyHierarchyPartitionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-DeleteOntologyHierarchyPartitionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: AthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource:
                  - !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary"
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt PheBeeBucket.Arn
                  - !Sub "${PheBeeBucket.Arn}/*"
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                  - glue:UpdateTable
                Resource: !If
                  - IcebergDatabaseProvided
                  - !If
                    - CatalogAccountIdProvided
                    # Multi-account: Add both local AND cross-account Glue resources
                    - - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                      - !Sub
                        - "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${DbName}"
                        - DbName: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
                      - !Sub
                        - "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${DbName}/*"
                        - DbName: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
                      - !Sub "arn:aws:glue:${AWS::Region}:${CatalogAccountId}:catalog"
                      - !Sub
                        - "arn:aws:glue:${AWS::Region}:${CatalogAccountId}:database/${DbName}"
                        - DbName: !If [CatalogDatabaseNameProvided, !Ref CatalogDatabaseName, !Ref IcebergDatabase]
                      - !Sub
                        - "arn:aws:glue:${AWS::Region}:${CatalogAccountId}:table/${DbName}/*"
                        - DbName: !If [CatalogDatabaseNameProvided, !Ref CatalogDatabaseName, !Ref IcebergDatabase]
                    # Single-account: Only local Glue resources
                    - - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                      - !Sub
                        - "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${DbName}"
                        - DbName: !Ref IcebergDatabase
                      - !Sub
                        - "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${DbName}/*"
                        - DbName: !Ref IcebergDatabase
                  # IcebergDatabase not provided: Use default naming
                  - - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                    - !Sub
                      - "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${DbName}"
                      - DbName: !Join ['_', !Split ['-', !Ref AppName]]
                    - !Sub
                      - "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${DbName}/*"
                      - DbName: !Join ['_', !Split ['-', !Ref AppName]]
        - PolicyName: LakeFormationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                  - lakeformation:GetWorkUnits
                  - lakeformation:StartQueryPlanning
                  - lakeformation:GetWorkUnitResults
                  - lakeformation:GetQueryState
                  - lakeformation:GetQueryStatistics
                Resource: "*"

  DeleteOntologyHierarchyPartitionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-DeleteOntologyHierarchyPartitionFunction
      CodeUri: functions
      Handler: delete_ontology_hierarchy_partition.lambda_handler
      MemorySize: 256
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt DeleteOntologyHierarchyPartitionRole.Arn
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          ICEBERG_DATABASE: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
          ICEBERG_ONTOLOGY_HIERARCHY_TABLE: !Ref IcebergOntologyHierarchyTable
          PHEBEE_BUCKET_NAME: !Ref PheBeeBucket

  # EMR Serverless Application
  EMRServerlessApplication:
    Type: AWS::EMRServerless::Application
    Properties:
      Name: !Sub ${AppName}-BulkEvidenceProcessor
      Type: Spark
      ReleaseLabel: emr-7.10.0
      AutoStartConfiguration:
        Enabled: true
      AutoStopConfiguration:
        Enabled: true
        IdleTimeoutMinutes: 15
      # Spark jobs handle the evidence table, so they run inside the VPC like the
      # Lambdas. Each worker takes a private IP from these subnets while running.
      NetworkConfiguration:
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
        SecurityGroupIds:
          - !Ref PheBeeEmrSecurityGroup

  # EMR Execution Role
  EMRExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-EMRExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: emr-serverless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt PheBeeBucket.Arn
                  - !Sub "${PheBeeBucket.Arn}/*"
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/emr-serverless/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/emr-containers/*"
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:BatchCreatePartition
                  - glue:BatchUpdatePartition
                Resource: "*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt DynamoDBTable.Arn
        - PolicyName: LakeFormationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                  - lakeformation:GetWorkUnits
                  - lakeformation:StartQueryPlanning
                  - lakeformation:GetWorkUnitResults
                  - lakeformation:GetQueryState
                  - lakeformation:GetQueryStatistics
                Resource: "*"

  # Step Function for Bulk Import
  BulkImportStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AppName}-BulkImportStateMachine
      Role: !GetAtt BulkImportStateMachineRole.Arn
      DefinitionUri: statemachine/bulk_evidence_import.asl.json
      DefinitionSubstitutions:
        ValidateBulkImportFunction: !GetAtt ValidateBulkImportFunction.Arn
        EMRServerlessApplicationId: !Ref EMRServerlessApplication
        EMRExecutionRoleArn: !GetAtt EMRExecutionRole.Arn
        PheBeeBucketName: !Ref PheBeeBucket
        DynamoDBTableName: !Ref DynamoDBTable
        AWSRegion: !Ref AWS::Region
        IcebergDatabase: !If [IcebergDatabaseProvided, !Ref IcebergDatabase, !Join ['_', !Split ['-', !Ref AppName]]]
        IcebergEvidenceTable: !Ref IcebergEvidenceTable
        IcebergSubjectTermsBySubjectTable: !Ref IcebergSubjectTermsBySubjectTable
        IcebergSubjectTermsByProjectTermTable: !Ref IcebergSubjectTermsByProjectTermTable
        NeptuneClusterEndpoint: !GetAtt PheBeeNeptuneCluster.Endpoint
        StartNeptuneBulkLoadFunction: !GetAtt StartNeptuneBulkLoadFunction.Arn
        CheckNeptuneBulkLoadStatusFunction: !GetAtt CheckNeptuneBulkLoadStatusFunction.Arn
        GenerateTTLManifestFunction: !GetAtt GenerateTTLManifestFunction.Arn
        GenerateTTLFromIcebergFunction: !GetAtt GenerateTTLFromIcebergFunction.Arn
        NotifyBulkImportCompleteFunction: !GetAtt NotifyBulkImportCompleteFunction.Arn
        NotifyBulkImportFailureFunction: !GetAtt NotifyBulkImportFailureFunction.Arn
        MaterializeProjectSubjectTermsFunction: !GetAtt MaterializeProjectSubjectTermsFunction.Arn

  BulkImportStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-BulkImportStateMachineRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ValidateBulkImportFunction.Arn
                  - !GetAtt StartNeptuneBulkLoadFunction.Arn
                  - !GetAtt CheckNeptuneBulkLoadStatusFunction.Arn
                  - !GetAtt GenerateTTLManifestFunction.Arn
                  - !GetAtt GenerateTTLFromIcebergFunction.Arn
                  - !GetAtt NotifyBulkImportCompleteFunction.Arn
                  - !GetAtt NotifyBulkImportFailureFunction.Arn
                  - !GetAtt MaterializeProjectSubjectTermsFunction.Arn
        - PolicyName: EMRServerlessAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - emr-serverless:StartJobRun
                  - emr-serverless:GetJobRun
                  - emr-serverless:CancelJobRun
                Resource: 
                  - !Sub "arn:aws:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/${EMRServerlessApplication}"
                  - !Sub "arn:aws:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/${EMRServerlessApplication}/jobruns/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EMRExecutionRole.Arn
        - PolicyName: EventBridgeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:EnableRule
                  - events:DisableRule
                  - events:ListTargetsByRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: 
                  - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${AppName}-*"
                  - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForEMRServerlessJobRule"

  CheckBulkLoadStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AppName}-CheckBulkLoadStatusFunction
      CodeUri: functions
      Handler: check_bulk_load_status.lambda_handler
      MemorySize: 256
      Timeout: 60
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}
          Region: !Sub ${AWS::Region}
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
          - !Ref PheBeeNeptuneClientSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Policies:
        - !Ref PheBeeNeptuneReadPolicy
        - !Ref PheBeeNeptuneLoadPolicy

  CreateEvidenceTableFunction:
    Type: AWS::Serverless::Function
    Condition: ShouldCreateEvidenceTable
    Properties:
      FunctionName: !Sub "${AppName}-CreateEvidenceTableFunction"
      CodeUri: functions/
      Handler: create_evidence_table.lambda_handler
      Runtime: python3.11
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref PheBeeLambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt CreateEvidenceTableRole.Arn

  CreateSubjectTermsBySubjectTableFunction:
    Type: AWS::Serverless::Function

      CodeUri: functions
      Handler: reset_database.lambda_handler
      MemorySize: 512
      # Serial work: a Neptune reset that waits for cluster and SPARQL
      # availability, then four Athena DELETEs. A timeout here leaves the
      # database partially cleared, so the budget is deliberately generous.
      Timeout: 900
      Layers:
        - !Ref PheBeeUtilsLayer
      Environment:
        Variables:
          NeptuneEndpoint: !Sub https://${PheBeeNeptuneCluster.Endpoint}:${PheBeeNeptuneCluster.Port}

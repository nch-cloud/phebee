        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
          - !If [HasSubnetId3, !Ref SubnetId3, !Ref AWS::NoValue]
      Role: !GetAtt CreateSubjectTermsBySubjectTableRole.Arn

  CreateSubjectTermsByProjectTermTableFunction:
    Type: AWS::Serverless::Function
